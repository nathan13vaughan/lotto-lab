name: Update results

on:
  schedule:
    # Draws are around 8:30pm Melbourne time. Run late that night and again early morning.
    - cron: "15 12 * * *"   # 10:15pm AEST / 11:15pm AEDT
    - cron: "30 19 * * *"   # 5:30am AEST / 6:30am AEDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download new draws
        run: python -m lottery.fetch
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/draws data/lotterywest.json && [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No new draws."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recompute stats
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m lottery.export
      - name: Commit
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws data/lotterywest.json docs/data/stats.json
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Update results $(date -u +%Y-%m-%d)"
          git push
